[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agents"
version = "0.1.0"
description = "Multi-agent code review pipeline on LangGraph with a local Ollama model"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.5",
    "langchain-ollama",
    "langchain-core",
    "pydantic>=2",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
code-review-agents = "code_review_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
